name: smart-kabinet

services:
  # БД
  postgres:
    image: postgres:16-alpine
    container_name: smartkabinet-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-20087404}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
      - ./docker/postgres/sql:/docker-init-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO S3 Object Storage (Silo drop-in fork)
  minio:
    image: pgsty/silo:latest
    container_name: smartkabinet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console (GUI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ML Service
  ml:
    build:
      context: ./ML
      dockerfile: Dockerfile
    container_name: smartkabinet-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      LLM_ENABLED: "1"
      LLM_TIMEOUT_S: "20"


  # Ollama LLM 
  ollama:
    image: ollama/ollama:0.12.6
    container_name: smartkabinet-ollama
    profiles: ["llm", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull qwen2.5:7b-instruct && wait"]

  # Backend Web API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartkabinet-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=SmartKabinet;Username=postgres;Password=20087404"
      ConnectionStrings__SyntheticDb: "Host=postgres;Port=5432;Database=SyntheticDb;Username=postgres;Password=20087404"
      S3Storage__ServiceUrl: "http://minio:9000"
      S3Storage__BucketName: "smart-kabinet-documents"
      S3Storage__AccessKey: "minioadmin"
      S3Storage__SecretKey: "minioadmin"
      MlService__BaseUrl: "http://ml:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ml:
        condition: service_started

  # Frontend 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartkabinet-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  ollama_data:
